name: videoraiq-web CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'client/'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client/'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: compile code but skip server-side PM2 restart'
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('videoraiq-web-pr-{0}', github.ref) || 'videoraiq-web-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI (install + lint + build validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
        # No cache: npm — update to cache: npm once a package-lock.json is committed in client/

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint
        # Soft-fail preserves execution pipeline — flip to hard-fail once warnings are cleaned up
        run: npm run lint  true

      - name: Validate Production Build
        run: npm run build

  deploy:
    name: Deploy to Web Server
    needs: ci
    # No deploy on PR runs — only on push to main or manual dispatch
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      WEBHOOK_PATH: /hooks/redeploy-web
      DRY_RUN: ${{ github.event.inputs.dry_run  'false' }}
    steps:
      - name: Dispatch secure webhook request
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.WEBHOOK_SECRET_KEY }}" ]; then
            echo "::error::WEBHOOK_SECRET_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_IP_OR_DOMAIN }}" ]; then
            echo "::error::SERVER_IP_OR_DOMAIN secret is not set"
            exit 1
          fi

          # Construct verifiable JSON payload string
          PAYLOAD=$(printf '{"event":"push","status":"verified","ref":"%s","sha":"%s","dry_run":%s}' \
            "${{ github.ref }}" "${{ github.sha }}" "$DRY_RUN")

          # Generate standard HMAC-SHA256 hex signature over the payload bytes
          SIGNATURE="sha256=$(printf '%s' "$PAYLOAD" \
            | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET_KEY }}" \
            | sed 's/^.* //')"

          # Note: If your Webhook daemon port is exposed natively on 9000 without an Nginx proxy, 
          # adjust the URL formatting scheme below to "http://${{ secrets.SERVER_IP_OR_DOMAIN }}:9000$WEBHOOK_PATH"
          URL="http://${{ secrets.SERVER_IP_OR_DOMAIN }}:9000$WEBHOOK_PATH"
          echo "POST $URL (dry_run=$DRY_RUN)"

          # Execute the request and fail the runner on any non-2xx status code
          HTTP_CODE=$(curl -sS -X POST \
            --max-time 60 \
            -o /tmp/webhook_response.txt \
            -w '%{http_code}' \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD" \
            "$URL")

          echo "Response ($HTTP_CODE):"
          cat /tmp/webhook_response.txt  true
          echo

          if [ "$HTTP_CODE" -lt 200 ]  [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Webhook returned HTTP $HTTP_CODE — redeploy script rejected or failed"
            exit 1
          fi
          echo "Webhook accepted — server-side redeploy-web script finished execution successfully."