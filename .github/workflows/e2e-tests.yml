name: E2E (Playwright)

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "e2e/**"
      - ".github/workflows/e2e-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "e2e/**"
      - ".github/workflows/e2e-tests.yml"
  schedule:
    # Nightly run against dev to catch drift / regressions
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target URL (overrides BASE_URL secret)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Check credentials
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has-creds: ${{ steps.check.outputs.has-creds }}
    steps:
      - id: check
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -n "$E2E_USERNAME" ] && [ -n "$E2E_PASSWORD" ]; then
            echo "has-creds=true" >> "$GITHUB_OUTPUT"
            echo "E2E credentials present — running the suite."
          else
            echo "has-creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E_USERNAME / E2E_PASSWORD secrets not set — skipping the authenticated Playwright suite. Add them under Settings → Secrets and variables → Actions."
          fi

  e2e:
    name: Playwright suite
    needs: preflight
    if: needs.preflight.outputs.has-creds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}

      - name: Install npm dependencies
        run: npm ci || npm install

      # Install all three browsers. The `setup` project always runs on
      # chromium regardless of which browser projects execute, so a partial
      # install (just one browser) breaks the auth setup.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install browser system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run Playwright
        env:
          BASE_URL: ${{ github.event.inputs.base_url || secrets.E2E_BASE_URL || 'https://dev-dashboard.videoraiq.com' || 'https://dev.videoraiq.com' }}
          BACKEND_URL: ${{ secrets.E2E_BACKEND_URL || 'https://dev-api.videoraiq.com' }}
          STREAMING_URL: ${{ secrets.E2E_STREAMING_URL || 'https://dev-stream.videoraiq.com' }}
          AUTH_COOKIE_NAME: ${{ secrets.E2E_AUTH_COOKIE_NAME || 'dev-access-token' }}
          LOGIN_PATH: ${{ secrets.E2E_LOGIN_PATH || '/admin-login' }}
          TEST_USERNAME: ${{ secrets.E2E_USERNAME }}
          TEST_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          ALLOW_DESTRUCTIVE_TESTS: "false"
          CI: "true"
        # No --project filter: runs setup → unauthenticated → chromium →
        # firefox → webkit, all defined in playwright.config.js.
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload traces and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ github.run_id }}
          path: e2e/test-results/
          retention-days: 14
