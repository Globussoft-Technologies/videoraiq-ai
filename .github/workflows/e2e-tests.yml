name: E2E (Playwright)

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "e2e/**"
      - ".github/workflows/e2e-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "e2e/**"
      - ".github/workflows/e2e-tests.yml"
  schedule:
    # Nightly run against dev to catch drift / regressions
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target URL (overrides BASE_URL secret)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Install browser system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.project }}

      - name: Run Playwright
        env:
          BASE_URL: ${{ github.event.inputs.base_url || secrets.E2E_BASE_URL || 'https://dev.videoraiq.com' }}
          BACKEND_URL: ${{ secrets.E2E_BACKEND_URL || 'https://dev-api.videoraiq.com' }}
          STREAMING_URL: ${{ secrets.E2E_STREAMING_URL || 'https://dev-stream.videoraiq.com' }}
          AUTH_COOKIE_NAME: ${{ secrets.E2E_AUTH_COOKIE_NAME || 'dev-access-token' }}
          LOGIN_PATH: ${{ secrets.E2E_LOGIN_PATH || '/login' }}
          TEST_USERNAME: ${{ secrets.E2E_USERNAME }}
          TEST_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          ALLOW_DESTRUCTIVE_TESTS: "false"
          CI: "true"
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}-${{ github.run_id }}
          path: e2e/test-results/
          retention-days: 14
