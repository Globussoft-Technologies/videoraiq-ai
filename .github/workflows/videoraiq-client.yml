name: videoraiq-client CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-videoraiq-client.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-videoraiq-client.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: rsync --dry-run, no nginx reload'
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('videoraiq-client-pr-{0}', github.ref) || 'videoraiq-client-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI (install + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
        # No `cache: npm` — update to `cache: npm` once a package-lock.json is committed.

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build

      # - name: Test
      #   # Hard-fail: a failing test fails the ci job, and `deploy` has
      #   # `needs: ci`, so deploy is skipped unless tests pass.
      #   run: npm run test

  deploy:
    name: Deploy to dev server
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Per-service server + login -> repo Secrets, prefixed VIDEORAIQ_CLIENT_*.
      # The login user MUST be the unix user that owns REMOTE_PATH.
      REMOTE_HOST: ${{ secrets.VIDEORAIQ_CLIENT_DEPLOY_HOST }}
      REMOTE_USER: ${{ secrets.VIDEORAIQ_CLIENT_DEPLOY_USER }}
      # Per-service values -> repo Variables, prefixed VIDEORAIQ_CLIENT_*.
      # Set them in Settings -> Secrets and variables -> Actions -> Variables.
      REMOTE_PATH: ${{ vars.VIDEORAIQ_CLIENT_REMOTE_PATH }}      # absolute path the app lives in on the server
      APP_PORT: ${{ vars.VIDEORAIQ_CLIENT_APP_PORT }}            # port the frontend listens on (health check)
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate service config
        # Fail fast with a clear message if a per-service Variable is unset,
        # instead of rsync-ing into an empty path or grepping an empty port.
        run: |
          missing=0
          for v in REMOTE_PATH APP_PORT; do
            if [ -z "${!v}" ]; then
              echo "::error::Variable VIDEORAIQ_CLIENT_${v} is not set (Settings -> Secrets and variables -> Actions -> Variables)"
              missing=1
            fi
          done
          [ "$missing" = "0" ]

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VIDEORAIQ_CLIENT_DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.VIDEORAIQ_CLIENT_DEPLOY_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.VIDEORAIQ_CLIENT_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          fi
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName $REMOTE_HOST
            User $REMOTE_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Sanity-check SSH + server state
        run: |
          ssh deploy "hostname; id; test -d $REMOTE_PATH && echo 'REMOTE_PATH ok' || (echo 'REMOTE_PATH missing!'; exit 2)"

      - name: Build locally
        working-directory: client
        run: npm ci --no-audit --no-fund && npm run build

      - name: Rsync dist folder
        run: |
          RSYNC_FLAGS="-avz --human-readable --delete"
          if [ "$DRY_RUN" = "true" ]; then
            RSYNC_FLAGS="$RSYNC_FLAGS --dry-run"
            echo "### DRY RUN — no files will be written ###"
          fi
          rsync $RSYNC_FLAGS \
            --exclude='node_modules/' \
            --exclude='logs/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*.log' \
            client/dist/ \
            deploy:"$REMOTE_PATH/"
            
      - name: Restart PM2 apps
        if: env.DRY_RUN != 'true'
        run: |
          ssh deploy "pm2 restart all && pm2 save"

      - name: Reload nginx
        if: env.DRY_RUN != 'true'
        run: |
          ssh deploy "sudo systemctl reload nginx || sudo service nginx reload || echo 'WARNING: nginx reload failed'"

      - name: Health check
        if: env.DRY_RUN != 'true'
        run: |
          sleep 3
          ssh deploy "ss -tln | grep ':$APP_PORT ' || (echo 'port $APP_PORT not listening'; exit 3)"
          ssh deploy "curl -sS -o /dev/null -w '%{http_code}\n' --max-time 10 http://127.0.0.1:$APP_PORT/ || (echo 'Frontend not reachable'; exit 4)"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key


