<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoraIQ 2.0</title>
</head>

<body>
  <!-- Visible before the JavaScript bundle loads; React replaces this at mount. -->
  <div id="root">
    <style>
      .vq-boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 20px; background: radial-gradient(ellipse at center, #16213c, #06070d 70%); color: #aab4cf; font: 15px Arial, sans-serif; }
      .vq-boot-ring { width: 52px; height: 52px; border: 3px solid #28344d; border-top-color: #60a5fa; border-right-color: #a855f7; border-radius: 50%; animation: vq-boot-spin 1s linear infinite; }
      @keyframes vq-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .vq-boot-ring { animation: none; } }
    </style>
    <div class="vq-boot" role="status" aria-label="Loading application">
      <span class="vq-boot-ring" aria-hidden="true"></span>
      <span>Loading your dashboard…</span>
      <noscript>Please enable JavaScript to continue.</noscript>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
